services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
      SYSTEM_UPDATE_TOKEN: ${SYSTEM_UPDATE_TOKEN:?}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-oguzgokyar/yonetici-dashboard}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:?}
      COOLIFY_DEPLOY_WEBHOOK: ${COOLIFY_DEPLOY_WEBHOOK:?}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:?}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      GOOGLE_TOKEN_BASE64: ${GOOGLE_TOKEN_BASE64:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${GOOGLE_DRIVE_OAUTH_CLIENT_ID:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_DRIVE_OAUTH_REDIRECT_URI: ${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:-}
      CANVA_STUDIO_ENABLED: ${CANVA_STUDIO_ENABLED:-false}
      HERMES_AGENT_BASE_URL: ${HERMES_AGENT_BASE_URL:-http://10.0.1.8:8645}
      HERMES_AGENT_API_KEY: ${HERMES_AGENT_API_KEY:-}
      CANVA_CALLBACK_TOKEN: ${CANVA_CALLBACK_TOKEN:-}
      CANVA_CALLBACK_BASE_URL: ${CANVA_CALLBACK_BASE_URL:?}
    volumes:
      - yonetici-data:/app/.data
    ports:
      - "${HOST_PORT:-3100}:${APP_PORT:-3000}"
    expose:
      - "${APP_PORT:-3000}"
    restart: unless-stopped

volumes:
  yonetici-data:
