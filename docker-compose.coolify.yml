services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
      SYSTEM_UPDATE_TOKEN: ${SYSTEM_UPDATE_TOKEN:?}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-oguzgokyar/yonetici-dashboard}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN:?}
      COOLIFY_DEPLOY_WEBHOOK: ${COOLIFY_DEPLOY_WEBHOOK:?}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:?}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      GOOGLE_TOKEN_JSON: ${GOOGLE_TOKEN_JSON:-}
    volumes:
      - yonetici-data:/app/.data
    ports:
      - "${HOST_PORT:-3100}:${APP_PORT:-3000}"
    expose:
      - "${APP_PORT:-3000}"
    restart: unless-stopped

volumes:
  yonetici-data:
